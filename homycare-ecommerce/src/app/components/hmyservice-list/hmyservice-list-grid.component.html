<table class="table">

  <thead class="table-dark">
    <tr>
      <th></th>
      <th>Name</th>
      <th>Description</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let tempService of hmyservice">
      <td>
          <img src="{{ tempService.imageUrl }}" />
      </td>
      <td>{{ tempService.name}}</td>
      <td>{{ tempService.description}}</td>
    </tr>
  </tbody>
</table>
