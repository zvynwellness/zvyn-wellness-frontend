<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <div class="row">

        <!-- loop over the collection of products -->
        <div *ngFor="let tempService of hmyservice" class="col-md-3">

          <div class="product-box">
            <img src="{{ tempService.imageUrl }}" class="img-responsive">
            <h1>{{ tempService.name }}</h1>
            <div>{{ tempService.description}}</div>
            <!--<div class="price">{{ tempProduct.unitPrice | currency:'USD' }}</div>-->
            <a href="#" class="primary-btn">Add to cart</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
