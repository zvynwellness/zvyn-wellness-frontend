<section class="services-hero">
  <p class="services-eyebrow">ZVYN WELLNESS SERVICES</p>
  <h1>Care designed around <em>you.</em></h1>
  <p>Explore personalized ways to restore your energy, rebalance your rhythm, and move forward feeling supported.</p>
</section>
<div class="services-toolbar"><app-product-category-menu></app-product-category-menu><app-search></app-search></div>
<div class="main-content services-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <div class="row">

        <!-- loop over the collection of products -->
        <div *ngFor="let tempProduct of products" class="col-md-4">

          <div class="product-box">

            <!-- adding link to product name and image -->
            <a routerLink="/products/{{ tempProduct.id }}">
              <img src="{{ tempProduct.imageUrl }}" class="img-responsive" alt="{{ tempProduct.name }}">
            </a>

            <a routerLink="/products/{{ tempProduct.id }}">
              <h1>{{ tempProduct.name }}</h1>
            </a>

            <div>{{ tempProduct.description}}</div>

            <!--<div class="price">{{ tempProduct.unitPrice | currency:'USD' }}</div>-->
            <a routerLink="/products/{{ tempProduct.id }}" class="service-link">Explore service <span>→</span></a>
          </div>
        </div>

        <!-- if products empty then display a message -->
        <div *ngIf="products?.length == 0" class="alert alert-warning col-md-12" role="alert">
          No wellness services matched your search.
        </div>

      </div>
      <!-- begin footer -->
      <div class="footer-pagination">
        <div class="row">
          <div class="col-md-6"></div>

          <div class="col-md-6">
            <div class="row">
              <div class="col-md-9" style="padding-left: 30%">

                <ngb-pagination [(page)]="thePageNumber"
                                [pageSize]="thePageSize"
                                [collectionSize]="theTotalElements"
                                [maxSize]="5"
                                (pageChange)="listProducts()">

                </ngb-pagination>

              </div>

              <div class="col-md-3 mt-2" style="text-align: right;">
                <span class="mr-2">Services per page</span>

                <select #myPageSelect (change)="updatePageSize(myPageSelect.value)">
                  <option>1</option>
                  <option selected="true">5</option>
                  <option>10</option>
                  <option>20</option>
                  <option>50</option>
                </select>

              </div>

            </div>
          </div>

        </div>
      </div>
      <!-- end footer -->

    </div>
  </div>
</div>
