<table class="table">

  <thead class="table-dark">
    <tr>
      <th></th>
      <th>Name</th>
      <th>Description</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let tempProduct of products">
      <td>
          <img src="{{ tempProduct.imageUrl }}" />
      </td>
      <td>{{ tempProduct.name}}</td>
      <td>{{ tempProduct.description}}</td>
    </tr>
  </tbody>
</table>
